services:
  - type: web
    name: eventsphere
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn --app-dir backend app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eventsphere-db
          property: connectionString
      - key: DEMO_ENABLED
        value: "1"
      - key: DEMO_DATA_ENABLED
        value: "1"
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_STAFF_PASSWORD
        generateValue: true
      - key: DEMO_ATTENDEE_PASSWORD
        generateValue: true

databases:
  - name: eventsphere-db
    plan: free
    ipAllowList: []
