<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events | EventSphere</title>
  <link rel="stylesheet" href="/css/vendor/bootstrap-utilities.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><nav class="shell" aria-label="Main navigation">
  <a class="brand" href="/">EventSphere</a>
  <div id="account-nav"></div>
</nav></header>
<main class="shell">
  <div class="hero">
    <p class="eyebrow">University of Vavuniya demo</p>
    <h1>Find your next campus event</h1>
    <p class="intro">Explore events, book your place, and keep your QR tickets on your phone.</p>
  </div>
  <p id="message" class="notice" role="status" aria-live="polite" hidden></p>
  <section class="event-search" aria-labelledby="browse-heading">
    <h2 id="browse-heading">Browse events</h2>
    <div class="filter-bar d-flex flex-wrap gap-3">
      <label>Search by keyword <input id="keyword" type="search" placeholder="Title, venue or description"></label>
      <label>Category <select id="category"><option value="">All categories</option></select></label>
    </div>
    <div id="events" class="cards event-grid" aria-live="polite"></div>
  </section>
</main>
<script src="/js/workspace.js" defer></script>
<script src="/js/main.js" defer></script>
</body>
</html>
